<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Game Offline Player (1280x720)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #game-container {
            width: 1280px;
            height: 720px;
            max-width: 95vw;
            max-height: 80vh;
            border: 3px solid #444;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h2>Java Game Offline Player (1280x720)</h2>
    <div id="game-container">
        <!-- Sử dụng web giả lập hỗ trợ chạy Offline trực tiếp -->
        <iframe src="https://j2me-loader.github.io/web/"></iframe>
    </div>
    <p><b>Hướng dẫn:</b> Nếu game không tự nạp, hãy bấm chọn tệp <code>game.jar</code> trên màn hình giả lập để mở game Offline.</p>
</body>
</html>
