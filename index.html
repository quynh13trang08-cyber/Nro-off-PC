<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Java Game HD</title>
    <script src="https://cjrtnc.leaningtech.com/2.0/loader.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #game-container {
            width: 1280px;
            height: 720px;
            max-width: 95vw;
            max-height: 80vh;
            border: 3px solid #444;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h2>Java Game Online Player (1280x720)</h2>
    <div id="game-container" id="cheerpjDisplay"></div>
    <p>Đang tải bộ chạy Java, vui lòng chờ trong giây lát...</p>

    <script>
        async function loadGame() {
            await cheerpjInit();
            cheerpjCreateDisplay(1280, 720, document.getElementById('game-container'));
            await cheerpjRunJar('/app/game.jar');
        }
        loadGame();
    </script>
</body>
</html>
