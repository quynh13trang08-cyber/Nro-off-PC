<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Java Game</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 80vh;
            border: 3px solid #444;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h2>Java Game Online Player</h2>
    <div id="game-container">
        <!-- Sử dụng nguồn giả lập J2ME Web thay thế ổn định -->
        <iframe src="https://j2me.js.org/me.html?jar=game.jar"></iframe>
    </div>
    <p>Sử dụng bàn phím hoặc chuột/cảm ứng để điều khiển.</p>
</body>
</html>
